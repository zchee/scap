[package]
name = "scap"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "A remote repository management CLI in Rust, a port of x-motemen/ghq."
repository = "https://github.com/zchee/scap"
readme = "README.md"

# An empty workspace table pins the workspace root to this manifest so cargo
# does not search parent directories for one (a stray package manifest above
# this repository would otherwise make every cargo command fail).
[workspace]

[dependencies]
jwalk = "0.9"
anyhow = { version = "1", default-features = false }
bstr = { version = "1", default-features = false }
clap = { version = "4", features = ["derive"] }
# `sha1` is not optional in practice: gix-hash refuses to build unless one of
# `sha1`/`sha256` is selected, and both crates forward the flag to gix-ref.
gix-config = { version = "0.60", features = ["sha1"] }
gix-discover = { version = "0.55", features = ["sha1"] }
gix-url = "0.37"
# Decision D-1: the stale-tmp liveness probe is `kill(pid, 0)` through
# rustix's safe wrapper instead of a `kill -0` subprocess. Only the `process`
# feature is requested here; the walker's `fs` feature belongs to Phase 3.
rustix = { version = "1.1", features = ["process"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1", features = ["attributes"], default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = { version = "3", default-features = false }
# Only the W1.3 differential test compiles ghq's codecommit pattern; the crate
# itself ships no runtime regex engine.
regex = "1"
tempfile = { version = "3", default-features = false }
# Adds `tracing/std` (release build does not request it, so this stays
# test-only) for `tracing::subscriber::with_default`, used by
# src/lib_tests.rs to install a subscriber scoped to one test body.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# ADR-11 bounded-unsafe policy. The shipped walker took the B2 (`rustix`)
# path, so the crate holds no `unsafe` at all and no `allow(unsafe_code)`
# site exists in product code; these denials are what keeps that true as the
# walker is written. `undocumented_unsafe_blocks` is the gate that enforces
# `// SAFETY:` coverage, so no grep clause is needed for it in V-2.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug-assertions = false
overflow-checks = false
