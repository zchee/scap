# CodSpeed exec-harness targets: whole-program `scap` runs, measured in
# walltime mode.
#
# This layer complements the divan micro-benchmarks in benches/, which
# measure pure functions under the simulation instrument. What it adds is
# the part simulation cannot see: process startup, the configuration file
# reads, and the parallel directory walk's system calls. Walltime is only
# stable on dedicated hardware, so the workflow runs this job on
# `runs-on: codspeed-macro` and keeps it opt-in
# (`vars.CODSPEED_WALLTIME == 'true'`).
#
# On the file name: the CodSpeed CLI discovers `codspeed.yaml`,
# `codspeed.yml`, `.codspeed.yaml`, `.codspeed.yml` in that priority order
# (CodSpeedHQ/codspeed src/project_config/discover.rs), so the project's
# `.yaml`-not-`.yml` rule is satisfiable here and this file takes the
# highest-priority name. The tool's own docs spell it `codspeed.yml`; both
# work.
#
# The tree these run against is generated by scripts/bench-fixture.sh into
# target/bench-fixture, which must be run before `codspeed run`. Paths are
# relative to the repository root, which is where the runner executes.
#
# Each target pins its own environment rather than inheriting the machine's:
# `-u SCAP_ROOT` so the root comes from the fixture gitconfig and not from a
# developer's shell, and `GIT_CONFIG_NOSYSTEM=1` so /etc/gitconfig cannot
# change the answer between a laptop and a runner. The repository-level
# config of the checkout is still read, exactly as it would be for any real
# invocation from inside a git repository.
#
# These numbers are NOT comparable to the hyperfine rows in
# docs/benchmarks/: those are measured on a quiet machine under the plan's
# D-4 RUSTFLAGS regime, and CI builds with clean flags.
$schema: https://raw.githubusercontent.com/CodSpeedHQ/codspeed/refs/heads/main/schemas/codspeed.schema.json

options:
  warmup-time: "1s"
  max-time: "20s"

benchmarks:
  # Startup plus configuration only: no walk at all. This is the floor every
  # other command pays, and the row that would move if ADR-8's in-process
  # loader ever regressed into spawning `git`.
  - name: "scap root (config load only)"
    id: exec-root
    exec: env -u SCAP_ROOT GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=target/bench-fixture/gitconfig ./target/release/scap root

  # The full walk: 1800 repositories over 3 hosts, plus the non-repository
  # subtrees the walker has to descend into and list nothing from.
  - name: "scap list (1800 repositories)"
    id: exec-list
    exec: env -u SCAP_ROOT GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=target/bench-fixture/gitconfig ./target/release/scap list
    options:
      max-time: "60s"

  # The same walk with the post-processing the plan budgets -- the query
  # filter, `--unique`'s deduplication, and the sort -- switched on. The
  # difference between this row and the one above is what that stage costs;
  # a micro-benchmark of it is deferred until it has a public seam
  # (Phase 3 / W3.3 rewrites it on byte slices).
  - name: "scap list --unique <query> (walk plus post-processing)"
    id: exec-list-postprocess
    exec: env -u SCAP_ROOT GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=target/bench-fixture/gitconfig ./target/release/scap list --unique repo-007
    options:
      max-time: "60s"
