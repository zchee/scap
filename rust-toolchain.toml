[toolchain]
# Floating `nightly` per CLAUDE.md "Toolchain". The ADR-12 dated pin
# (`nightly-2026-08-28`, rustc e457a7b0d) covered W1.2 onward and was
# lifted early by user ruling on 2026-08-30 (originally scheduled for
# W5.2): the project is still in development, so reproducible-gate
# concerns yield to tracking current nightly. Frozen benchmark numbers
# in docs/benchmarks/ were measured under the pin; fingerprints of
# binaries built after this change will not match the d2eb8054-era
# values, and that is expected.
channel = "nightly"
components = ["rustfmt", "clippy"]
